<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gain-Graph | Pure Gain Bar Analytics</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Roboto+Mono:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #090b10;
      --card-bg: #111520;
      --border: rgba(255, 255, 255, 0.08);
      --text: #f1f5f9;
      --muted: #64748b;
      --grid: #1e2638;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', -apple-system, sans-serif;
      overflow-x: hidden;
      overflow-y: auto;
    }

    /* Clean Scrollbar */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: #263044; border-radius: 3px; }

    #app {
      width: 100%;
      max-width: 1600px;
      margin: 0 auto;
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      min-height: 100vh;
    }

    /* ── Compact Controls Header ── */
    #top-bar {
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      padding: 10px 14px;
      border-radius: 10px;
    }

    .top-bar-main {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
    }

    .brand-title {
      font-size: 1.1rem;
      font-weight: 800;
      letter-spacing: -0.3px;
      color: #38bdf8;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .btn {
      padding: 5px 12px;
      font-size: 0.8rem;
      font-weight: 600;
      border-radius: 6px;
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(255,255,255,0.06);
      color: #fff;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: all 0.15s;
    }
    .btn:hover {
      background: rgba(255,255,255,0.14);
      border-color: rgba(255,255,255,0.25);
    }
    .btn-add {
      background: #0284c7;
      border-color: #38bdf8;
      color: #fff;
    }
    .btn-add:hover { background: #0369a1; }

    /* ── Multi-Entity Tracker List (Compact Rows) ── */
    #targets-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .target-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #0c0f17;
      border: 1px solid var(--border);
      border-left: 4px solid #00e676;
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 0.8rem;
    }

    .target-chip select,
    .target-chip input[type="text"] {
      background: #182030;
      border: 1px solid #28354d;
      color: #fff;
      padding: 3px 6px;
      border-radius: 4px;
      font-size: 0.78rem;
      outline: none;
    }

    .target-chip select { max-width: 140px; }
    .target-chip input[type="text"] { width: 140px; }

    .target-color-picker {
      width: 22px;
      height: 22px;
      border: none;
      border-radius: 4px;
      background: transparent;
      cursor: pointer;
      padding: 0;
    }

    .target-live-info {
      font-weight: 700;
      font-family: 'Roboto Mono', monospace;
      color: #cbd5e1;
      font-size: 0.78rem;
      white-space: nowrap;
    }

    .target-remove-btn {
      background: transparent;
      border: none;
      color: #ef4444;
      cursor: pointer;
      font-size: 1rem;
      padding: 0 3px;
      line-height: 1;
    }

    /* ── Viewport Selector Tabs ── */
    .view-tabs {
      display: flex;
      background: #090c14;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 2px;
      gap: 2px;
    }
    .view-tab-btn {
      padding: 4px 10px;
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--muted);
      background: transparent;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    .view-tab-btn.active {
      background: #0284c7;
      color: #fff;
    }

    /* ════════════════════════════════════════════════════════
       THE 4 BAR GRAPHS (CLEAN & PURE)
    ════════════════════════════════════════════════════════ */
    #graphs-container {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      flex: 1;
      width: 100%;
    }

    #graphs-container.view-single {
      grid-template-columns: 1fr;
    }

    .graph-panel {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-height: 280px;
    }

    #graphs-container.view-single .graph-panel {
      min-height: 580px;
    }

    .graph-panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .graph-panel-title {
      font-size: 0.85rem;
      font-weight: 700;
      color: #e2e8f0;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .graph-panel-title .badge {
      background: #0284c7;
      color: #fff;
      font-size: 0.68rem;
      font-weight: 800;
      padding: 2px 6px;
      border-radius: 4px;
    }

    .graph-legend {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.75rem;
      font-family: 'Roboto Mono', monospace;
      flex-wrap: wrap;
    }

    .legend-item {
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .legend-dot {
      width: 8px;
      height: 8px;
      border-radius: 2px;
    }

    .canvas-box {
      flex: 1;
      width: 100%;
      position: relative;
      background: #07090e;
      border-radius: 6px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.03);
    }

    canvas.pure-canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* ── Settings Drawer ── */
    #settings-drawer {
      position: fixed;
      top: 0;
      right: -340px;
      width: 320px;
      height: 100vh;
      background: #0f131c;
      border-left: 1px solid var(--border);
      box-shadow: -8px 0 30px rgba(0,0,0,0.7);
      z-index: 99999;
      display: flex;
      flex-direction: column;
      transition: right 0.25s ease;
      padding: 16px;
      gap: 16px;
    }
    #settings-drawer.open { right: 0; }

    .settings-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      padding-bottom: 10px;
    }
    .settings-header h3 { font-size: 1rem; font-weight: 700; }
    .close-btn { background: transparent; border: none; color: #888; font-size: 1.2rem; cursor: pointer; }
    .close-btn:hover { color: #fff; }

    .settings-content {
      display: flex;
      flex-direction: column;
      gap: 14px;
      overflow-y: auto;
      flex: 1;
    }

    .set-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-size: 0.8rem;
    }
    .set-row label { color: #94a3b8; }
    .set-row input, .set-row select {
      background: #182030;
      border: 1px solid #28354d;
      color: #fff;
      padding: 4px 6px;
      border-radius: 4px;
      font-size: 0.78rem;
      outline: none;
    }
    .set-row input[type="range"] { width: 80px; accent-color: #38bdf8; }
    .set-row input[type="number"] { width: 50px; text-align: center; }

    /* ── OBS Mode ── */
    body.obs-mode {
      padding: 0 !important;
      background: transparent !important;
    }
    body.obs-mode #top-bar,
    body.obs-mode #settings-drawer {
      display: none !important;
    }
    body.obs-mode #app {
      padding: 4px !important;
      max-width: 100% !important;
    }

    #exit-obs-btn {
      display: none;
      position: fixed;
      bottom: 12px;
      right: 12px;
      z-index: 999999;
      background: rgba(15, 19, 28, 0.95);
      border: 1px solid #38bdf8;
      color: #38bdf8;
      font-size: 11px;
      font-weight: 700;
      padding: 6px 12px;
      border-radius: 5px;
      cursor: pointer;
    }

    @media (max-width: 900px) {
      #graphs-container { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <div id="app">

    <!-- ── Top Controls Bar ── -->
    <div id="top-bar">
      <div class="top-bar-main">
        <div class="brand-title">
          📊 Gain-Graph
        </div>

        <div class="header-actions">
          <div class="view-tabs" id="view-tabs">
            <button class="view-tab-btn active" data-view="all">2x2 Grid</button>
            <button class="view-tab-btn" data-view="1s">1s</button>
            <button class="view-tab-btn" data-view="1m">1m</button>
            <button class="view-tab-btn" data-view="1h">1h</button>
            <button class="view-tab-btn" data-view="1d">1d</button>
          </div>
          <button class="btn btn-add" id="btn-add-target">＋ Add Tracker</button>
          <button class="btn" id="btn-obs-toggle">🎥 OBS</button>
          <button class="btn" id="btn-reset-gains">🗑️ Reset</button>
          <button class="btn" id="btn-open-settings">⚙️ Settings</button>
        </div>
      </div>

      <!-- Compact Targets Chips List -->
      <div id="targets-list"></div>
    </div>

    <!-- ── 4 Pure Bar Graphs ── -->
    <div id="graphs-container">

      <!-- 1s Graph -->
      <div class="graph-panel" id="panel-1s">
        <div class="graph-panel-header">
          <div class="graph-panel-title">
            <span class="badge">1s</span> 1-Second Rate of Change
          </div>
          <div class="graph-legend" id="legend-1s"></div>
        </div>
        <div class="canvas-box">
          <canvas class="pure-canvas" id="canvas-1s"></canvas>
        </div>
      </div>

      <!-- 1m Graph -->
      <div class="graph-panel" id="panel-1m">
        <div class="graph-panel-header">
          <div class="graph-panel-title">
            <span class="badge">1m</span> 1-Minute Interval Gains
          </div>
          <div class="graph-legend" id="legend-1m"></div>
        </div>
        <div class="canvas-box">
          <canvas class="pure-canvas" id="canvas-1m"></canvas>
        </div>
      </div>

      <!-- 1h Graph -->
      <div class="graph-panel" id="panel-1h">
        <div class="graph-panel-header">
          <div class="graph-panel-title">
            <span class="badge">1h</span> 1-Hour Interval Gains
          </div>
          <div class="graph-legend" id="legend-1h"></div>
        </div>
        <div class="canvas-box">
          <canvas class="pure-canvas" id="canvas-1h"></canvas>
        </div>
      </div>

      <!-- 1d Graph -->
      <div class="graph-panel" id="panel-1d">
        <div class="graph-panel-header">
          <div class="graph-panel-title">
            <span class="badge">1d</span> 24-Hour Daily Gains
          </div>
          <div class="graph-legend" id="legend-1d"></div>
        </div>
        <div class="canvas-box">
          <canvas class="pure-canvas" id="canvas-1d"></canvas>
        </div>
      </div>

    </div>

  </div>

  <button id="exit-obs-btn">Exit OBS (Esc)</button>

  <!-- Settings Drawer -->
  <div id="settings-drawer">
    <div class="settings-header">
      <h3>⚙️ Graph Settings</h3>
      <button class="close-btn" id="btn-close-settings">&times;</button>
    </div>
    <div class="settings-content">
      <div class="set-row">
        <label>Visible Bars</label>
        <input type="number" id="set-bar-count" min="5" max="80" value="24" />
      </div>
      <div class="set-row">
        <label>Bar Spacing (px)</label>
        <input type="number" id="set-bar-gap" min="1" max="15" value="4" />
      </div>
      <div class="set-row">
        <label>Corner Radius</label>
        <input type="number" id="set-bar-radius" min="0" max="12" value="3" />
      </div>
      <div class="set-row">
        <label>Y-Axis Scaling</label>
        <select id="set-yaxis">
          <option value="stepped" selected>Stepped (Jumps on Reach)</option>
          <option value="smooth">Continuous (Smooth)</option>
        </select>
      </div>
      <div class="set-row">
        <label>Value Labels</label>
        <select id="set-labels">
          <option value="show" selected>Always Show</option>
          <option value="hide">Hide</option>
        </select>
      </div>
      <div class="set-row">
        <label>Canvas Background</label>
        <input type="color" id="set-bg-canvas" value="#07090e" />
      </div>
      <div class="set-row">
        <label>Grid Line Color</label>
        <input type="color" id="set-grid-color" value="#1e2638" />
      </div>
      <div class="set-row">
        <label>Fetch Rate (sec)</label>
        <input type="number" id="set-fetch-sec" min="1" max="15" value="2" />
      </div>
    </div>
  </div>

  <script>
    /* ════════════════════════════════════════════════════════
       PURE GAIN GRAPH ENGINE (MULTI-ENTITY)
    ════════════════════════════════════════════════════════ */
    const DEFAULT_COLORS = ['#00e676', '#38bdf8', '#f59e0b', '#ec4899', '#a855f7', '#10b981'];
    let visibleBarsCount = 24;
    let barGap = 4;
    let barRadius = 3;
    let yAxisMode = 'stepped';
    let showLabels = true;
    let fetchSec = 2;

    // Multi-entity targets: [ { id, type, query, color, name, count, history: [{t, v}], gains: {1s, 1m, 1h, 1d} } ]
    let targets = [];
    let nextId = 1;

    // Bucket history per interval: { '1s': [ { t, targetGains: { targetId: gainVal } } ] }
    let bucketHistory = {
      '1s': [],
      '1m': [],
      '1h': [],
      '1d': []
    };

    /* ════════════════════════════════════════════════════════
       API FETCHER
    ════════════════════════════════════════════════════════ */
    async function fetchCount(type, query) {
      if (!query || !query.trim()) return null;
      const q = query.trim();

      try {
        if (type === 'roblox') {
          const res = await fetch(`https://groups.roblox.com/v1/groups/${q}`);
          if (!res.ok) return null;
          const d = await res.json();
          return { name: d.name || `Group ${q}`, count: d.memberCount || 0 };
        }
        if (type === 'roblox-game-visits' || type === 'roblox-game-players') {
          const res = await fetch(`https://mixerno.space/api/roblox-game-counter/user/${q}`);
          if (!res.ok) return null;
          const d = await res.json();
          const visits = d?.counts?.[0]?.count ?? d?.counts?.find(c => c.value === 'visits')?.count ?? 0;
          const players = d?.counts?.[1]?.count ?? d?.counts?.find(c => c.value === 'playing')?.count ?? 0;
          return { name: d?.user?.[0]?.count || `Game ${q}`, count: type === 'roblox-game-visits' ? visits : players };
        }
        if (type === 'youtube') {
          const res = await fetch(`https://mixerno.space/api/youtube-channel-counter/user/${q}`);
          if (!res.ok) return null;
          const d = await res.json();
          return { name: d?.user?.[0]?.count || `YT ${q}`, count: d?.counts?.[0]?.count || 0 };
        }
        if (type === 'youtube-sctools') {
          const res = await fetch(`https://api.subscribercounter.nl/api/youtube-view-counter/${q}/data`);
          if (!res.ok) return null;
          const d = await res.json();
          return { name: d?.channelName || `YT ${q}`, count: d?.subCount || 0 };
        }
        if (type === 'tiktok' || type === 'twitter' || type === 'instagram') {
          const res = await fetch(`https://mixerno.space/api/${type}-user-counter/user/${q}`);
          if (!res.ok) return null;
          const d = await res.json();
          return { name: d?.user?.[0]?.count || `@${q}`, count: d?.counts?.[0]?.count || 0 };
        }
      } catch (err) {
        console.error(err);
      }
      return null;
    }

    /* ════════════════════════════════════════════════════════
       TARGET MANAGEMENT
    ════════════════════════════════════════════════════════ */
    function addTarget(initialType = 'youtube', initialQuery = 'UCBJycsmduvYEL83R_U4JriQ', initialColor = null) {
      const id = nextId++;
      const color = initialColor || DEFAULT_COLORS[(id - 1) % DEFAULT_COLORS.length];

      const chip = document.createElement('div');
      chip.className = 'target-chip';
      chip.id = `chip-${id}`;
      chip.style.borderLeftColor = color;

      chip.innerHTML = `
        <select class="t-type">
          <option value="youtube" ${initialType==='youtube'?'selected':''}>YouTube</option>
          <option value="youtube-sctools" ${initialType==='youtube-sctools'?'selected':''}>YouTube (SCTools)</option>
          <option value="roblox" ${initialType==='roblox'?'selected':''}>Roblox Group</option>
          <option value="roblox-game-visits" ${initialType==='roblox-game-visits'?'selected':''}>Roblox (Visits)</option>
          <option value="roblox-game-players" ${initialType==='roblox-game-players'?'selected':''}>Roblox (Players)</option>
          <option value="tiktok" ${initialType==='tiktok'?'selected':''}>TikTok</option>
          <option value="twitter" ${initialType==='twitter'?'selected':''}>Twitter</option>
          <option value="instagram" ${initialType==='instagram'?'selected':''}>Instagram</option>
        </select>
        <input type="text" class="t-query" placeholder="ID or Username" value="${initialQuery}" />
        <input type="color" class="target-color-picker" value="${color}" title="Change bar color" />
        <span class="target-live-info">...</span>
        <button class="target-remove-btn" title="Remove">&times;</button>
      `;

      document.getElementById('targets-list').appendChild(chip);

      const targetObj = {
        id,
        chip,
        type: initialType,
        query: initialQuery,
        color,
        name: initialQuery,
        count: null,
        history: [],
        gains: { '1s': 0, '1m': 0, '1h': 0, '1d': 0 }
      };

      targets.push(targetObj);

      const typeSel = chip.querySelector('.t-type');
      const queryInp = chip.querySelector('.t-query');
      const colorInp = chip.querySelector('.target-color-picker');
      const removeBtn = chip.querySelector('.target-remove-btn');

      typeSel.addEventListener('change', () => { targetObj.type = typeSel.value; pollTarget(targetObj); });
      queryInp.addEventListener('change', () => { targetObj.query = queryInp.value; pollTarget(targetObj); });
      colorInp.addEventListener('input', (e) => {
        targetObj.color = e.target.value;
        chip.style.borderLeftColor = e.target.value;
        renderAllGraphs();
      });

      removeBtn.addEventListener('click', () => {
        if (targets.length <= 1) return;
        chip.remove();
        targets = targets.filter(t => t.id !== id);
        saveState();
        renderAllGraphs();
      });

      pollTarget(targetObj);
      saveState();
      return targetObj;
    }

    async function pollTarget(t) {
      const res = await fetchCount(t.type, t.query);
      if (!res) return;

      t.name = res.name;
      t.count = res.count;
      const now = Date.now();

      t.history.push({ t: now, v: res.count });
      if (t.history.length > 25000) t.history.shift();

      // Compute rolling gains
      function getWindowGain(windowMs) {
        if (t.history.length < 2) return 0;
        const targetTime = now - windowMs;
        let base = t.history[0].v;
        for (let i = t.history.length - 1; i >= 0; i--) {
          if (t.history[i].t <= targetTime) {
            base = t.history[i].v;
            break;
          }
        }
        return t.count - base;
      }

      t.gains['1s'] = t.history.length >= 2 ? (t.count - t.history[t.history.length - 2].v) : 0;
      t.gains['1m'] = getWindowGain(60 * 1000);
      t.gains['1h'] = getWindowGain(60 * 60 * 1000);
      t.gains['1d'] = getWindowGain(24 * 60 * 60 * 1000);

      // Update chip live info text
      const infoEl = t.chip.querySelector('.target-live-info');
      if (infoEl) {
        infoEl.textContent = `${t.name}: ${t.count.toLocaleString()}`;
      }
    }

    async function tickAll() {
      const now = Date.now();
      for (const t of targets) {
        await pollTarget(t);
      }

      // Record snapshot into bucket history
      ['1s', '1m', '1h', '1d'].forEach(interval => {
        const arr = bucketHistory[interval];
        const last = arr[arr.length - 1];
        const threshold = interval === '1s' ? 1000 : (interval === '1m' ? 4000 : (interval === '1h' ? 30000 : 60000));

        const snapshot = { t: now, gains: {} };
        targets.forEach(t => { snapshot.gains[t.id] = t.gains[interval]; });

        if (last && (now - last.t) < threshold) {
          last.gains = snapshot.gains;
        } else {
          arr.push(snapshot);
          if (arr.length > 150) arr.shift();
        }
      });

      renderAllGraphs();
    }

    /* ════════════════════════════════════════════════════════
       PURE CANVAS BAR GRAPH RENDERER
    ════════════════════════════════════════════════════════ */
    function renderGraph(canvasId, interval) {
      const canvas = document.getElementById(canvasId);
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      const W = canvas.width = canvas.offsetWidth;
      const H = canvas.height = canvas.offsetHeight;

      const bg = document.getElementById('set-bg-canvas')?.value || '#07090e';
      const grid = document.getElementById('set-grid-color')?.value || '#1e2638';

      ctx.fillStyle = bg;
      ctx.fillRect(0, 0, W, H);

      // Update Legend
      const legendEl = document.getElementById(`legend-${interval}`);
      if (legendEl) {
        legendEl.innerHTML = targets.map(t => `
          <div class="legend-item" style="color:${t.color}">
            <span class="legend-dot" style="background:${t.color}"></span>
            <span>${t.name}: ${(t.gains[interval] > 0 ? '+' : '') + t.gains[interval].toLocaleString()}</span>
          </div>
        `).join('');
      }

      const arr = bucketHistory[interval] || [];
      const slice = arr.slice(-visibleBarsCount);

      if (slice.length === 0 || targets.length === 0) {
        ctx.fillStyle = '#475569';
        ctx.font = '11px Inter, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('Collecting real-time gain samples...', W / 2, H / 2);
        return;
      }

      // Collect min & max across all target bars in slice
      let minVal = 0;
      let maxVal = 0;
      slice.forEach(s => {
        Object.values(s.gains).forEach(v => {
          if (v < minVal) minVal = v;
          if (v > maxVal) maxVal = v;
        });
      });

      let min = minVal;
      let max = maxVal;

      if (yAxisMode === 'stepped') {
        const diff = Math.max(1, maxVal - minVal);
        const exp = Math.floor(Math.log10(diff));
        let step = Math.pow(10, exp);
        if (diff / step <= 2) step /= 2;
        else if (diff / step >= 5) step *= 2;
        if (step < 1) step = 1;

        min = Math.floor(minVal / step) * step;
        max = Math.ceil(maxVal / step) * step;
        if (max === min) max = min + step;
      } else {
        const pad = Math.max(1, (maxVal - minVal) * 0.1);
        min = minVal - pad;
        max = maxVal + pad;
      }

      const range = max - min || 1;

      const padL = 40;
      const padR = 12;
      const padT = 16;
      const padB = 22;
      const gW = W - padL - padR;
      const gH = H - padT - padB;

      // Zero baseline
      const zeroY = padT + gH - ((0 - min) / range) * gH;

      // Draw Grid & Y-Axis ticks
      ctx.strokeStyle = grid;
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.setLineDash([3, 3]);

      const steps = 4;
      for (let i = 0; i <= steps; i++) {
        const y = padT + (gH / steps) * i;
        ctx.moveTo(padL, y);
        ctx.lineTo(W - padR, y);

        const val = Math.round(max - (range / steps) * i);
        ctx.fillStyle = '#64748b';
        ctx.font = '9px Roboto Mono, monospace';
        ctx.textAlign = 'right';
        ctx.fillText((val > 0 ? '+' : '') + val.toLocaleString(), padL - 6, y + 3);
      }
      ctx.stroke();
      ctx.setLineDash([]);

      // Baseline Line
      ctx.strokeStyle = '#475569';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(padL, zeroY);
      ctx.lineTo(W - padR, zeroY);
      ctx.stroke();

      // Render Clustered Bars for each time slot
      const timeSlots = slice.length;
      const slotW = gW / Math.max(1, timeSlots);
      const targetCount = targets.length;
      const totalBarSpace = Math.max(2, slotW - barGap);
      const singleBarW = Math.max(2, totalBarSpace / targetCount);

      slice.forEach((s, slotIdx) => {
        const slotX = padL + slotIdx * slotW + (slotW - totalBarSpace) / 2;

        targets.forEach((t, tIdx) => {
          const val = s.gains[t.id] ?? 0;
          const isPos = val >= 0;
          const valY = padT + gH - ((val - min) / range) * gH;
          const barH = Math.max(1, Math.abs(valY - zeroY));
          const topY = isPos ? valY : zeroY;
          const barX = slotX + tIdx * singleBarW;

          ctx.fillStyle = t.color;

          if (barRadius > 0 && typeof ctx.roundRect === 'function') {
            ctx.beginPath();
            ctx.roundRect(barX, topY, Math.max(1, singleBarW - 1), barH, [isPos ? barRadius : 0, isPos ? barRadius : 0, !isPos ? barRadius : 0, !isPos ? barRadius : 0]);
            ctx.fill();
          } else {
            ctx.fillRect(barX, topY, Math.max(1, singleBarW - 1), barH);
          }

          // Value Label
          if (showLabels && singleBarW >= 10 && Math.abs(val) > 0) {
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 8px Inter, sans-serif';
            ctx.textAlign = 'center';
            const txt = (val > 0 ? '+' : '') + (Math.abs(val) >= 1000 ? (val / 1000).toFixed(1) + 'K' : val);
            ctx.fillText(txt, barX + singleBarW / 2, isPos ? topY - 3 : topY + barH + 9);
          }
        });

        // Time on X-Axis
        if (slotIdx % Math.max(1, Math.floor(timeSlots / 6)) === 0 || slotIdx === timeSlots - 1) {
          const d = new Date(s.t);
          const timeStr = d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: interval === '1s' ? '2-digit' : undefined });
          ctx.fillStyle = '#475569';
          ctx.font = '8px Roboto Mono, monospace';
          ctx.textAlign = 'center';
          ctx.fillText(timeStr, slotX + totalBarSpace / 2, H - 5);
        }
      });
    }

    function renderAllGraphs() {
      renderGraph('canvas-1s', '1s');
      renderGraph('canvas-1m', '1m');
      renderGraph('canvas-1h', '1h');
      renderGraph('canvas-1d', '1d');
    }

    /* ════════════════════════════════════════════════════════
       UI INTERACTIONS & SETTINGS
    ════════════════════════════════════════════════════════ */
    document.getElementById('btn-add-target').addEventListener('click', () => {
      addTarget('roblox', '1074557114');
    });

    document.getElementById('btn-reset-gains').addEventListener('click', () => {
      bucketHistory = { '1s': [], '1m': [], '1h': [], '1d': [] };
      targets.forEach(t => { t.history = []; t.gains = { '1s': 0, '1m': 0, '1h': 0, '1d': 0 }; });
      renderAllGraphs();
    });

    // View Switcher Tabs
    document.querySelectorAll('.view-tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.view-tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const view = btn.dataset.view;
        const container = document.getElementById('graphs-container');

        if (view === 'all') {
          container.className = '';
          document.querySelectorAll('.graph-panel').forEach(p => p.style.display = '');
        } else {
          container.className = 'view-single';
          document.querySelectorAll('.graph-panel').forEach(p => {
            p.style.display = p.id === `panel-${view}` ? '' : 'none';
          });
        }
        renderAllGraphs();
      });
    });

    // Settings Drawer
    const drawer = document.getElementById('settings-drawer');
    document.getElementById('btn-open-settings').addEventListener('click', () => drawer.classList.add('open'));
    document.getElementById('btn-close-settings').addEventListener('click', () => { drawer.classList.remove('open'); saveState(); });

    document.getElementById('set-bar-count').addEventListener('input', e => { visibleBarsCount = parseInt(e.target.value) || 24; renderAllGraphs(); });
    document.getElementById('set-bar-gap').addEventListener('input', e => { barGap = parseInt(e.target.value) || 4; renderAllGraphs(); });
    document.getElementById('set-bar-radius').addEventListener('input', e => { barRadius = parseInt(e.target.value) || 3; renderAllGraphs(); });
    document.getElementById('set-yaxis').addEventListener('change', e => { yAxisMode = e.target.value; renderAllGraphs(); });
    document.getElementById('set-labels').addEventListener('change', e => { showLabels = e.target.value === 'show'; renderAllGraphs(); });
    document.getElementById('set-bg-canvas').addEventListener('input', renderAllGraphs);
    document.getElementById('set-grid-color').addEventListener('input', renderAllGraphs);
    document.getElementById('set-fetch-sec').addEventListener('change', e => {
      fetchSec = Math.max(1, parseInt(e.target.value) || 2);
      resetTimer();
    });

    // OBS Stream Mode
    function toggleObs(enable) {
      const isObs = enable !== undefined ? enable : !document.body.classList.contains('obs-mode');
      document.body.classList.toggle('obs-mode', isObs);
      document.getElementById('exit-obs-btn').style.display = isObs ? 'block' : 'none';
    }

    document.getElementById('btn-obs-toggle').addEventListener('click', () => toggleObs(true));
    document.getElementById('exit-obs-btn').addEventListener('click', () => toggleObs(false));
    document.addEventListener('keydown', e => { if (e.key === 'Escape') toggleObs(false); });

    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('obs') === 'true' || urlParams.get('clean') === 'true') toggleObs(true);

    /* ════════════════════════════════════════════════════════
       PERSISTENCE
    ════════════════════════════════════════════════════════ */
    function saveState() {
      try {
        const state = {
          targets: targets.map(t => ({ type: t.type, query: t.query, color: t.color })),
          options: {
            barCount: visibleBarsCount,
            barGap,
            barRadius,
            yAxisMode,
            showLabels,
            bgCanvas: document.getElementById('set-bg-canvas')?.value,
            gridColor: document.getElementById('set-grid-color')?.value,
            fetchSec
          }
        };
        localStorage.setItem('gain_graph_pure_state', JSON.stringify(state));
      } catch (e) {}
    }

    function loadState() {
      try {
        const raw = localStorage.getItem('gain_graph_pure_state');
        if (!raw) {
          addTarget('youtube', 'UCBJycsmduvYEL83R_U4JriQ', '#38bdf8');
          addTarget('roblox', '1074557114', '#00e676');
          return;
        }
        const state = JSON.parse(raw);
        if (state.targets && state.targets.length > 0) {
          state.targets.forEach(t => addTarget(t.type, t.query, t.color));
        } else {
          addTarget('youtube', 'UCBJycsmduvYEL83R_U4JriQ', '#38bdf8');
          addTarget('roblox', '1074557114', '#00e676');
        }

        if (state.options) {
          const o = state.options;
          if (o.barCount) { visibleBarsCount = o.barCount; document.getElementById('set-bar-count').value = o.barCount; }
          if (o.barGap) { barGap = o.barGap; document.getElementById('set-bar-gap').value = o.barGap; }
          if (o.barRadius) { barRadius = o.barRadius; document.getElementById('set-bar-radius').value = o.barRadius; }
          if (o.yAxisMode) { yAxisMode = o.yAxisMode; document.getElementById('set-yaxis').value = o.yAxisMode; }
          if (o.showLabels !== undefined) { showLabels = o.showLabels; document.getElementById('set-labels').value = showLabels ? 'show' : 'hide'; }
          if (o.bgCanvas) document.getElementById('set-bg-canvas').value = o.bgCanvas;
          if (o.gridColor) document.getElementById('set-grid-color').value = o.gridColor;
          if (o.fetchSec) { fetchSec = o.fetchSec; document.getElementById('set-fetch-sec').value = o.fetchSec; }
        }
      } catch (e) {
        addTarget('youtube', 'UCBJycsmduvYEL83R_U4JriQ', '#38bdf8');
        addTarget('roblox', '1074557114', '#00e676');
      }
    }

    let pollTimer = null;
    function resetTimer() {
      if (pollTimer) clearInterval(pollTimer);
      pollTimer = setInterval(tickAll, fetchSec * 1000);
    }

    window.addEventListener('resize', renderAllGraphs);
    window.addEventListener('beforeunload', saveState);

    // Initial Start
    loadState();
    tickAll();
    resetTimer();
  </script>
</body>
</html>
