<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gain-Graph | Horizontal Gain Bars</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      background: #000000;
      color: #ffffff;
      font-family: 'Roboto', -apple-system, sans-serif;
      overflow: hidden;
      user-select: none;
    }

    /* ── Pure Fullscreen Graph Stage ── */
    #stage {
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-evenly;
      padding: 20px 30px;
      gap: 15px;
    }

    .gain-section {
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex: 1;
      justify-content: center;
    }

    .gain-section-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      font-size: 14px;
      font-weight: 700;
      color: #888888;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding: 0 4px;
    }

    .gain-bars-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      width: 100%;
    }

    /* ── Single Horizontal Bar Row ── */
    .hbar-row {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      height: 38px;
    }

    .hbar-label {
      width: 160px;
      font-size: 14px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: #ffffff;
      flex-shrink: 0;
    }

    .hbar-track {
      flex: 1;
      height: 100%;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 4px;
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
    }

    .hbar-fill {
      height: 100%;
      width: 0%;
      background: #00e676;
      border-radius: 4px;
      transition: width 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      position: absolute;
      left: 0;
      top: 0;
    }

    .hbar-val-outside {
      font-family: 'Roboto Mono', monospace;
      font-size: 15px;
      font-weight: 900;
      min-width: 90px;
      text-align: right;
      flex-shrink: 0;
      color: #ffffff;
    }

    /* ── Floating Controls Button (Unobtrusive) ── */
    #gear-btn {
      position: fixed;
      top: 10px;
      right: 10px;
      background: rgba(20, 20, 20, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #aaaaaa;
      font-size: 16px;
      padding: 6px 10px;
      border-radius: 6px;
      cursor: pointer;
      z-index: 9999;
      opacity: 0.25;
      transition: opacity 0.2s, background 0.2s;
    }
    #gear-btn:hover {
      opacity: 1;
      background: rgba(30, 30, 30, 0.95);
      color: #ffffff;
    }

    /* ── Setup Modal ── */
    #modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(8px);
      z-index: 99999;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    #modal.open {
      display: flex;
    }

    .modal-box {
      background: #111111;
      border: 1px solid #333333;
      border-radius: 8px;
      width: 580px;
      max-width: 100%;
      max-height: 90vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .modal-head {
      padding: 14px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #222222;
      font-weight: 700;
      font-size: 15px;
    }

    .modal-body {
      padding: 16px 18px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .target-edit-row {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #181818;
      padding: 8px 10px;
      border-radius: 6px;
    }

    .target-edit-row select,
    .target-edit-row input[type="text"] {
      background: #0a0a0a;
      border: 1px solid #333;
      color: #fff;
      padding: 6px 8px;
      border-radius: 4px;
      font-size: 13px;
      outline: none;
    }
    .target-edit-row select { flex: 1; }
    .target-edit-row input[type="text"] { flex: 2; }
    .target-edit-row input[type="color"] {
      width: 28px;
      height: 28px;
      border: none;
      border-radius: 4px;
      background: transparent;
      cursor: pointer;
    }
    .btn-del {
      background: transparent;
      border: none;
      color: #ff4444;
      font-size: 16px;
      cursor: pointer;
      padding: 0 4px;
    }

    .btn-modal {
      background: #00e676;
      color: #000;
      border: none;
      padding: 8px 14px;
      font-size: 13px;
      font-weight: 700;
      border-radius: 4px;
      cursor: pointer;
    }
    .btn-modal-secondary {
      background: #222;
      color: #fff;
      border: 1px solid #444;
    }

    .modal-foot {
      padding: 12px 18px;
      border-top: 1px solid #222;
      display: flex;
      justify-content: space-between;
    }

    /* OBS / Clean mode */
    body.clean #gear-btn { display: none; }
  </style>
</head>
<body>

  <!-- ── Pure Fullscreen Stage (Horizontal Bars) ── -->
  <div id="stage">

    <!-- 1-Second Total Gain -->
    <div class="gain-section" id="sec-1s">
      <div class="gain-section-header">
        <span>1-Second Gain</span>
      </div>
      <div class="gain-bars-group" id="bars-1s"></div>
    </div>

    <!-- 1-Minute Total Gain -->
    <div class="gain-section" id="sec-1m">
      <div class="gain-section-header">
        <span>1-Minute Gain</span>
      </div>
      <div class="gain-bars-group" id="bars-1m"></div>
    </div>

    <!-- 1-Hour Total Gain -->
    <div class="gain-section" id="sec-1h">
      <div class="gain-section-header">
        <span>1-Hour Gain</span>
      </div>
      <div class="gain-bars-group" id="bars-1h"></div>
    </div>

    <!-- 1-Day Total Gain -->
    <div class="gain-section" id="sec-1d">
      <div class="gain-section-header">
        <span>1-Day (24h) Gain</span>
      </div>
      <div class="gain-bars-group" id="bars-1d"></div>
    </div>

    <!-- Total Tracked Session Gain -->
    <div class="gain-section" id="sec-total">
      <div class="gain-section-header">
        <span>Total Gain (Since Start)</span>
      </div>
      <div class="gain-bars-group" id="bars-total"></div>
    </div>

  </div>

  <!-- Discrete Floating Config Button -->
  <button id="gear-btn" title="Edit Tracked Channels & Settings">⚙️</button>

  <!-- Setup & Target Config Modal -->
  <div id="modal">
    <div class="modal-box">
      <div class="modal-head">
        <span>Tracked Targets & Settings</span>
        <button id="btn-close-modal" style="background:transparent;border:none;color:#aaa;font-size:18px;cursor:pointer;">&times;</button>
      </div>
      <div class="modal-body">
        <div style="font-size:12px;color:#888;">Add channels or Roblox games/groups to track their total gains horizontally:</div>
        <div id="modal-targets-list" style="display:flex;flex-direction:column;gap:8px;"></div>
        <button class="btn-modal btn-modal-secondary" id="btn-add-row">＋ Add Another Target</button>
      </div>
      <div class="modal-foot">
        <button class="btn-modal btn-modal-secondary" id="btn-reset-session">🗑️ Reset Total Gains</button>
        <button class="btn-modal" id="btn-save-modal">Save & Close</button>
      </div>
    </div>
  </div>

  <script>
    const DEFAULT_COLORS = ['#00e676', '#00b0ff', '#ff9100', '#f50057', '#d500f9', '#ffd600'];

    // Trackers State: [ { id, type, query, color, name, initialCount, currentCount, history: [{t, v}] } ]
    let trackers = [];
    let nextId = 1;

    async function fetchTargetData(type, query) {
      if (!query || !query.trim()) return null;
      const q = query.trim();

      try {
        if (type === 'roblox') {
          const res = await fetch(`https://groups.roblox.com/v1/groups/${q}`);
          if (!res.ok) return null;
          const d = await res.json();
          return { name: d.name || `Roblox Group ${q}`, count: d.memberCount || 0 };
        }
        if (type === 'roblox-game-visits' || type === 'roblox-game-players') {
          const res = await fetch(`https://mixerno.space/api/roblox-game-counter/user/${q}`);
          if (!res.ok) return null;
          const d = await res.json();
          const visits = d?.counts?.[0]?.count ?? d?.counts?.find(c => c.value === 'visits')?.count ?? 0;
          const players = d?.counts?.[1]?.count ?? d?.counts?.find(c => c.value === 'playing')?.count ?? 0;
          return { name: d?.user?.[0]?.count || `Roblox Game ${q}`, count: type === 'roblox-game-visits' ? visits : players };
        }
        if (type === 'youtube') {
          const res = await fetch(`https://mixerno.space/api/youtube-channel-counter/user/${q}`);
          if (!res.ok) return null;
          const d = await res.json();
          return { name: d?.user?.[0]?.count || `YT ${q}`, count: d?.counts?.[0]?.count || 0 };
        }
        if (type === 'youtube-sctools') {
          const res = await fetch(`https://api.subscribercounter.nl/api/youtube-view-counter/${q}/data`);
          if (!res.ok) return null;
          const d = await res.json();
          return { name: d?.channelName || `YT ${q}`, count: d?.subCount || 0 };
        }
        if (type === 'tiktok' || type === 'twitter' || type === 'instagram') {
          const res = await fetch(`https://mixerno.space/api/${type}-user-counter/user/${q}`);
          if (!res.ok) return null;
          const d = await res.json();
          return { name: d?.user?.[0]?.count || `@${q}`, count: d?.counts?.[0]?.count || 0 };
        }
      } catch (err) {
        console.error(err);
      }
      return null;
    }

    function calculateGains(t, now) {
      if (!t.history || t.history.length === 0) {
        return { '1s': 0, '1m': 0, '1h': 0, '1d': 0, 'total': 0 };
      }

      function getGainForWindow(ms) {
        const targetT = now - ms;
        let baseVal = t.history[0].v;
        for (let i = t.history.length - 1; i >= 0; i--) {
          if (t.history[i].t <= targetT) {
            baseVal = t.history[i].v;
            break;
          }
        }
        return t.currentCount - baseVal;
      }

      const g1s = t.history.length >= 2 ? (t.currentCount - t.history[t.history.length - 2].v) : 0;
      const g1m = getGainForWindow(60 * 1000);
      const g1h = getGainForWindow(60 * 60 * 1000);
      const g1d = getGainForWindow(24 * 60 * 60 * 1000);
      const gTotal = t.initialCount !== null ? (t.currentCount - t.initialCount) : 0;

      return { '1s': g1s, '1m': g1m, '1h': g1h, '1d': g1d, 'total': gTotal };
    }

    async function pollAll() {
      const now = Date.now();
      for (const t of trackers) {
        const res = await fetchTargetData(t.type, t.query);
        if (res) {
          t.name = res.name;
          if (t.initialCount === null) t.initialCount = res.count;
          t.currentCount = res.count;
          t.history.push({ t: now, v: res.count });
          if (t.history.length > 25000) t.history.shift();
        }
      }
      renderHorizontalBars(now);
    }

    /* ════════════════════════════════════════════════════════
       RENDER PURE HORIZONTAL BARS
    ════════════════════════════════════════════════════════ */
    function formatGainNum(n) {
      const sign = n > 0 ? '+' : (n < 0 ? '-' : '+');
      const abs = Math.abs(n);
      if (abs >= 1e9) return sign + (abs / 1e9).toFixed(2) + 'B';
      if (abs >= 1e6) return sign + (abs / 1e6).toFixed(2) + 'M';
      if (abs >= 1e3) return sign + (abs / 1e3).toFixed(1) + 'K';
      return sign + abs.toLocaleString();
    }

    function renderSectionBars(sectionKey, now) {
      const container = document.getElementById(`bars-${sectionKey}`);
      if (!container) return;

      // Compute gains for all trackers
      const list = trackers.map(t => {
        const gains = calculateGains(t, now);
        return {
          id: t.id,
          name: t.name || t.query,
          color: t.color,
          gain: gains[sectionKey]
        };
      });

      // Find max positive gain across targets in this section for proportional scaling
      const maxGain = Math.max(1, ...list.map(item => Math.max(0, item.gain)));

      container.innerHTML = list.map(item => {
        const ratio = Math.max(0, Math.min(1, item.gain / maxGain));
        const widthPct = (ratio * 100).toFixed(1);

        return `
          <div class="hbar-row">
            <div class="hbar-label" title="${item.name}">${item.name}</div>
            <div class="hbar-track">
              <div class="hbar-fill" style="width:${widthPct}%; background:${item.color};"></div>
            </div>
            <div class="hbar-val-outside" style="color:${item.color}">${formatGainNum(item.gain)}</div>
          </div>
        `;
      }).join('');
    }

    function renderHorizontalBars(now = Date.now()) {
      renderSectionBars('1s', now);
      renderSectionBars('1m', now);
      renderSectionBars('1h', now);
      renderSectionBars('1d', now);
      renderSectionBars('total', now);
    }

    /* ════════════════════════════════════════════════════════
       MODAL & SETTINGS
    ════════════════════════════════════════════════════════ */
    const modal = document.getElementById('modal');
    const modalList = document.getElementById('modal-targets-list');

    function openModal() {
      modalList.innerHTML = '';
      trackers.forEach(t => {
        const row = document.createElement('div');
        row.className = 'target-edit-row';
        row.innerHTML = `
          <select class="m-type">
            <option value="youtube" ${t.type==='youtube'?'selected':''}>YouTube (Mixerno)</option>
            <option value="youtube-sctools" ${t.type==='youtube-sctools'?'selected':''}>YouTube (SCTools)</option>
            <option value="roblox" ${t.type==='roblox'?'selected':''}>Roblox Group</option>
            <option value="roblox-game-visits" ${t.type==='roblox-game-visits'?'selected':''}>Roblox (Visits)</option>
            <option value="roblox-game-players" ${t.type==='roblox-game-players'?'selected':''}>Roblox (Players)</option>
            <option value="tiktok" ${t.type==='tiktok'?'selected':''}>TikTok</option>
            <option value="twitter" ${t.type==='twitter'?'selected':''}>Twitter</option>
            <option value="instagram" ${t.type==='instagram'?'selected':''}>Instagram</option>
          </select>
          <input type="text" class="m-query" value="${t.query}" placeholder="ID or Username" />
          <input type="color" class="m-color" value="${t.color}" />
          <button class="btn-del">&times;</button>
        `;
        row.querySelector('.btn-del').addEventListener('click', () => row.remove());
        modalList.appendChild(row);
      });
      modal.classList.add('open');
    }

    function addModalRow(type = 'youtube', query = '', color = null) {
      const c = color || DEFAULT_COLORS[modalList.children.length % DEFAULT_COLORS.length];
      const row = document.createElement('div');
      row.className = 'target-edit-row';
      row.innerHTML = `
        <select class="m-type">
          <option value="youtube">YouTube (Mixerno)</option>
          <option value="youtube-sctools">YouTube (SCTools)</option>
          <option value="roblox">Roblox Group</option>
          <option value="roblox-game-visits">Roblox (Visits)</option>
          <option value="roblox-game-players">Roblox (Players)</option>
          <option value="tiktok">TikTok</option>
          <option value="twitter">Twitter</option>
          <option value="instagram">Instagram</option>
        </select>
        <input type="text" class="m-query" value="${query}" placeholder="ID or Username" />
        <input type="color" class="m-color" value="${c}" />
        <button class="btn-del">&times;</button>
      `;
      row.querySelector('.m-type').value = type;
      row.querySelector('.btn-del').addEventListener('click', () => row.remove());
      modalList.appendChild(row);
    }

    document.getElementById('gear-btn').addEventListener('click', openModal);
    document.getElementById('btn-close-modal').addEventListener('click', () => modal.classList.remove('open'));
    document.getElementById('btn-add-row').addEventListener('click', () => addModalRow('roblox', '1074557114'));

    document.getElementById('btn-save-modal').addEventListener('click', () => {
      const rows = modalList.querySelectorAll('.target-edit-row');
      const newTrackers = [];
      rows.forEach((r, idx) => {
        const type = r.querySelector('.m-type').value;
        const query = r.querySelector('.m-query').value.trim();
        const color = r.querySelector('.m-color').value;
        if (query) {
          const existing = trackers.find(t => t.type === type && t.query === query);
          newTrackers.push(existing || {
            id: nextId++,
            type,
            query,
            color,
            name: query,
            initialCount: null,
            currentCount: null,
            history: []
          });
          if (existing) existing.color = color;
        }
      });

      if (newTrackers.length > 0) {
        trackers = newTrackers;
      }
      modal.classList.remove('open');
      saveLocal();
      pollAll();
    });

    document.getElementById('btn-reset-session').addEventListener('click', () => {
      trackers.forEach(t => {
        t.initialCount = t.currentCount;
        t.history = t.currentCount !== null ? [{ t: Date.now(), v: t.currentCount }] : [];
      });
      renderHorizontalBars();
      modal.classList.remove('open');
    });

    // Keyboard 'H' to toggle config gear button
    document.addEventListener('keydown', e => {
      if (e.key === 'h' || e.key === 'H') {
        document.body.classList.toggle('clean');
      }
      if (e.key === 'Escape' && modal.classList.contains('open')) {
        modal.classList.remove('open');
      }
    });

    /* ════════════════════════════════════════════════════════
       PERSISTENCE
    ════════════════════════════════════════════════════════ */
    function saveLocal() {
      try {
        const data = trackers.map(t => ({ type: t.type, query: t.query, color: t.color }));
        localStorage.setItem('gain_graph_horizontal_v1', JSON.stringify(data));
      } catch(e) {}
    }

    function loadLocal() {
      try {
        const raw = localStorage.getItem('gain_graph_horizontal_v1');
        if (raw) {
          const arr = JSON.parse(raw);
          if (arr && arr.length > 0) {
            trackers = arr.map(t => ({
              id: nextId++,
              type: t.type,
              query: t.query,
              color: t.color || '#00e676',
              name: t.query,
              initialCount: null,
              currentCount: null,
              history: []
            }));
            return;
          }
        }
      } catch(e) {}

      // Default targets: YouTube Marques Brownlee & Roblox Group
      trackers = [
        { id: nextId++, type: 'youtube', query: 'UCBJycsmduvYEL83R_U4JriQ', color: '#00b0ff', name: 'MKBHD', initialCount: null, currentCount: null, history: [] },
        { id: nextId++, type: 'roblox', query: '1074557114', color: '#00e676', name: 'Roblox Group', initialCount: null, currentCount: null, history: [] }
      ];
    }

    loadLocal();
    pollAll();
    setInterval(pollAll, 2000);
  </script>
</body>
</html>
